name: Build and Test Node

on:
  pull_request:
    branches:
      - develop
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Build and test
        run: |
          ./gradlew wrapper --gradle-version 8.13 --distribution-type bin
          ./gradlew -Dorg.gradle.jvmargs="-Xms2g -Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC" \
            -Dkotlin.daemon.jvmargs="-Xms512m -Xmx2g -XX:MaxMetaspaceSize=1g" \
            build --no-daemon --info
