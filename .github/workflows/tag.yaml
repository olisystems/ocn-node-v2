name: Update Int and Prod

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Login to SWR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: swr.eu-de.otc.t-systems.com
          username: ${{ secrets.OTC_USERNAME }}
          password: ${{ secrets.OTC_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: swr.eu-de.otc.t-systems.com/oli_banula/ocnnodev2:${{ github.ref_name }}

  update-int-and-prod:
    runs-on: ubuntu-latest
    needs: build-and-push
    # A separate group from the Build Image write-back: one shared group would
    # let a newer pending write-back cancel a pending release.
    concurrency:
      group: release-update-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.OLI_ARGO_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.OLI_ARGO_SYNC_PRIVATE_KEY }}
          permission-contents: write

      # Credentials stay persisted here: the git push below uses them.
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Int auto-syncs, so this deploys it. Prod takes the same tag but stays
      # OutOfSync until someone promotes it by hand.
      #
      # A pre-release stops at int: prod does not auto-sync, so pointing it at
      # an rc would leave it OutOfSync until someone clicked sync and shipped
      # the rc by accident.
      - name: Update Argo apps
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then apps="int"; else apps="int prod"; fi
          echo "APPS=$apps" >> "$GITHUB_ENV"
          for app in $apps; do
            yq -i '.spec.source.targetRevision = env(TAG)' "infra/argo/$app.yaml"
            yq -i '(.spec.source.helm.parameters[] | select(.name == "oli-app.image.tag")).value = env(TAG)' "infra/argo/$app.yaml"
          done

      - name: Commit and push
        run: |
          git config user.name "oli-argo-sync[bot]"
          git config user.email "275810390+oli-argo-sync[bot]@users.noreply.github.com"
          for app in $APPS; do git add "infra/argo/$app.yaml"; done
          # A re-run of the same release finds the files already updated.
          if git diff --cached --quiet; then
            echo "$APPS already point at $GITHUB_REF_NAME"
            exit 0
          fi
          git commit -m "chore: update $APPS to $GITHUB_REF_NAME"
          # A Build Image write-back can land on main at the same time. It
          # changes other files, so a rebase is clean.
          for _ in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          echo "::error::git push failed 3 times"
          exit 1
