name: Update Int and Prod

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to SWR
        uses: docker/login-action@v3
        with:
          registry: swr.eu-de.otc.t-systems.com
          username: ${{ secrets.OTC_USERNAME }}
          password: ${{ secrets.OTC_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: swr.eu-de.otc.t-systems.com/oli_banula/ocnnodev2:${{ github.ref_name }}

  update-int-and-prod:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OLI_ARGO_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.OLI_ARGO_SYNC_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Int auto-syncs, so this deploys it. Prod takes the same tag but stays
      # OutOfSync until someone promotes it by hand.
      #
      # A pre-release stops at int: prod does not auto-sync, so pointing it at
      # an rc would leave it OutOfSync until someone clicked sync and shipped
      # the rc by accident.
      - name: Update Argo apps
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then apps="int"; else apps="int prod"; fi
          echo "APPS=$apps" >> "$GITHUB_ENV"
          for app in $apps; do
            yq -i '.spec.source.targetRevision = env(TAG)' "infra/argo/$app.yaml"
            yq -i '(.spec.source.helm.parameters[] | select(.name == "oli-app.image.tag")).value = env(TAG)' "infra/argo/$app.yaml"
          done

      - name: Commit and push
        run: |
          git config user.name "oli-argo-sync[bot]"
          git config user.email "275810390+oli-argo-sync[bot]@users.noreply.github.com"
          for app in $APPS; do git add "infra/argo/$app.yaml"; done
          git commit -m "chore: update $APPS to ${{ github.ref_name }}"
          git push
