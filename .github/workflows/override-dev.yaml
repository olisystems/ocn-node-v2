name: Override Dev

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  override-dev:
    name: Override Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Compute short SHA and safe tag
        id: sha
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Docker tags only allow [A-Za-z0-9_.-], so branch names like feat/foo need sanitizing
          safe_ref=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)
          echo "safe_ref=$safe_ref" >> "$GITHUB_OUTPUT"

      - name: Login to SWR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: swr.eu-de.otc.t-systems.com
          username: ${{ secrets.OTC_USERNAME }}
          password: ${{ secrets.OTC_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            swr.eu-de.otc.t-systems.com/oli_banula/ocnnodev2:latest
            swr.eu-de.otc.t-systems.com/oli_banula/ocnnodev2:${{ steps.sha.outputs.safe_ref }}
            swr.eu-de.otc.t-systems.com/oli_banula/ocnnodev2:${{ steps.sha.outputs.safe_ref }}-${{ steps.sha.outputs.short_sha }}
            swr.eu-de.otc.t-systems.com/oli_banula/ocnnodev2:${{ steps.sha.outputs.short_sha }}

      - name: Connect to VPN
        env:
          VPN_CONFIG: ${{ secrets.VPN_CONFIG }}
          VPN_PASS: ${{ secrets.VPN_PASS }}
        run: |
          sudo apt-get update && sudo apt-get install -y openvpn
          printf '%s' "$VPN_CONFIG" > vpn.conf
          printf '%s' "$VPN_PASS" > .vpn_pass
          sudo openvpn --config vpn.conf --askpass .vpn_pass --log ovpn.log --daemon
          for _ in $(seq 1 30); do
            if sudo grep -q "Initialization Sequence Completed" ovpn.log 2>/dev/null; then
              echo "VPN connection established"
              break
            fi
            sleep 2
          done
          if ! sudo grep -q "Initialization Sequence Completed" ovpn.log 2>/dev/null; then
            echo "VPN failed to establish within timeout"
            sudo tail -n 100 ovpn.log || true
            exit 1
          fi
          rm -f vpn.conf .vpn_pass

      - name: Configure kubectl and point ArgoCD dev app to feature branch
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
          BRANCH: ${{ github.ref_name }}
          SAFE_REF: ${{ steps.sha.outputs.safe_ref }}
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig.yaml"
          chmod 600 "$RUNNER_TEMP/kubeconfig.yaml"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig.yaml"
          patch=$(jq -nc \
            --arg rev "$BRANCH" \
            --arg tag "$SAFE_REF-$SHORT_SHA" \
            '{spec:{source:{targetRevision:$rev,helm:{parameters:[{name:"oli-app.image.tag",value:$tag}]}}}}')
          kubectl patch application ocn-node-v2-dev -n argocd --type merge -p "$patch"
