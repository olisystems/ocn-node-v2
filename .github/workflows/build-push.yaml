name: Build Image

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - develop
    # The write-back commit below only touches infra/helm, so ignoring that
    # path is what stops this workflow re-triggering itself. A skip-ci
    # directive in the commit message would also suppress the pull_request
    # checks the branch rulesets require, leaving develop -> main PRs blocked.
    paths-ignore:
      - "infra/helm/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OLI_ARGO_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.OLI_ARGO_SYNC_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Compute short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to SWR
        uses: docker/login-action@v3
        with:
          registry: swr.eu-de.otc.t-systems.com
          username: ${{ secrets.OTC_USERNAME }}
          password: ${{ secrets.OTC_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            swr.eu-de.otc.t-systems.com/oli_banula/ocnnodev2:latest
            swr.eu-de.otc.t-systems.com/oli_banula/ocnnodev2:${{ github.ref_name }}
            swr.eu-de.otc.t-systems.com/oli_banula/ocnnodev2:${{ github.ref_name }}-${{ steps.sha.outputs.short_sha }}
            swr.eu-de.otc.t-systems.com/oli_banula/ocnnodev2:${{ steps.sha.outputs.short_sha }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tag in values file
        env:
          TAG: ${{ github.ref_name }}-${{ steps.sha.outputs.short_sha }}
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            yq -i '.oli-app.image.tag = env(TAG)' infra/helm/images.dev.yaml
          elif [ "${{ github.ref_name }}" = "main" ]; then
            yq -i '.oli-app.image.tag = env(TAG)' infra/helm/images.int.yaml
          fi

      - name: Commit and push
        run: |
          git config user.name "oli-argo-sync[bot]"
          git config user.email "275810390+oli-argo-sync[bot]@users.noreply.github.com"
          git add infra/helm/
          git commit -m "chore: update ${{ github.ref_name }} image to ${{ github.ref_name }}-${{ steps.sha.outputs.short_sha }}"
          git push
