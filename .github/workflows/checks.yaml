name: Checks

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main
    # Argo write-back commits only touch infra/helm, and nothing consumes a
    # push-triggered result. The pull_request trigger above is deliberately left
    # unfiltered, so the Build and Test context reports on every PR, helm-only
    # ones included.
    paths-ignore:
      - "infra/helm/**"

jobs:
  build-and-test:
    name: Build and Test
    # Draft PRs skip CI. ready_for_review is in the trigger types above so
    # the required contexts actually report once the PR leaves draft.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        run: ./gradlew build
