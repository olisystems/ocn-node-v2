name: Reset Override

# Clears any pin left behind by Override Dev / Override Int, so a merge always
# lands in the cluster.
#
# Deliberately no paths-ignore, unlike Build Image: this workflow makes no
# commits, so it cannot re-trigger itself. Filtering on infra/helm here would
# reintroduce the bug where a helm-only merge skips the run and silently leaves
# the app pinned to a feature branch.
on:
  push:
    branches:
      - main
      - develop

jobs:
  reset:
    name: Reset
    runs-on: ubuntu-latest
    # Build Image's write-back commit can never leave an override behind.
    if: github.actor != 'oli-argo-sync[bot]'

    steps:
      - name: Connect to VPN
        env:
          VPN_CONFIG: ${{ secrets.VPN_CONFIG }}
          VPN_PASS: ${{ secrets.VPN_PASS }}
        run: |
          sudo apt-get update && sudo apt-get install -y openvpn
          printf '%s' "$VPN_CONFIG" > vpn.conf
          printf '%s' "$VPN_PASS" > .vpn_pass
          sudo openvpn --config vpn.conf --askpass .vpn_pass --log ovpn.log --daemon
          for attempt in $(seq 1 30); do
            if sudo grep -q "Initialization Sequence Completed" ovpn.log 2>/dev/null; then
              echo "VPN connection established"
              break
            fi
            sleep 2
          done
          if ! sudo grep -q "Initialization Sequence Completed" ovpn.log 2>/dev/null; then
            echo "VPN failed to establish within timeout"
            sudo tail -n 100 ovpn.log || true
            exit 1
          fi
          rm -f vpn.conf .vpn_pass

      - name: Configure kubectl and reset ArgoCD dev app
        if: github.ref_name == 'develop'
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig.yaml"
          chmod 600 "$RUNNER_TEMP/kubeconfig.yaml"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig.yaml"
          kubectl patch application ocn-node-v2-dev -n argocd --type merge \
            -p '{"spec":{"source":{"targetRevision":"develop","helm":{"parameters":null}}}}'

      # No sync is triggered: the int app has no automated policy and is synced
      # by hand as usual.
      - name: Configure kubectl and reset ArgoCD int app
        if: github.ref_name == 'main'
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig.yaml"
          chmod 600 "$RUNNER_TEMP/kubeconfig.yaml"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig.yaml"
          kubectl patch application ocn-node-v2-int -n argocd --type merge \
            -p '{"spec":{"source":{"targetRevision":"main","helm":{"parameters":null}}}}'
