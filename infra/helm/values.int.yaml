oli-app:
  fullnameOverride: "ocn-node-v2-int"

  persistence:
    - name: ocn-node-v2-int-plugins
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      mountPath: /app/plugins

  image:
    tag: "main"

  ingress:
    hosts:
      - host: banula-int.oli-system.com
    tls:
      - secretName: banula-int-tls
        hosts:
          - banula-int.oli-system.com
    features:
      router:
        routes:
          exposeCommon: false
          exposeAll: true
