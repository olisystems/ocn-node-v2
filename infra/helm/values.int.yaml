oli-app:
  fullnameOverride: "ocn-node-v2-int"

  # EDX plugin (int only): pull edx-v1 from OBS. Plugin props via SPRING_APPLICATION_JSON (base values).
  env:
    OCN_PLUGINS: "edx-v1"
    OTC_ENDPOINT_URL: "https://obs.eu-de.otc.t-systems.com"
    OTC_DEFAULT_REGION: "eu-de"
    OTC_BUCKET_NAME: "ocn-node-plugins"
    OTC_ACCESS_KEY_ID:
      secretKeyRef:
        name: otc-obs-credentials
        key: access_key_id
    OTC_SECRET_ACCESS_KEY:
      secretKeyRef:
        name: otc-obs-credentials
        key: secret_access_key
    JDK_JAVA_OPTIONS: "-javaagent:/otel/javaagent.jar"
    OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=int,service.namespace=transit"
  # Copies the OpenTelemetry Java agent into the pod; JDK_JAVA_OPTIONS loads it.
  initContainers:
    - name: otel-agent
      image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.32.0
      command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
      volumeMounts:
        - name: otel-agent
          mountPath: /otel
  volumes:
    - name: otel-agent
      emptyDir: {}
  volumeMounts:
    - name: otel-agent
      mountPath: /otel
  gateway:
    parentRef:
      namespace: banula-int
    hosts:
      - banula-int.oli-system.com
