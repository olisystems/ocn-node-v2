oli-app:
  fullnameOverride: "ocn-node-v2-int"

  image:
    tag: "main"

  # EDX plugin (int only): OBS pull + plugin settings via Spring Boot JSON.
  # ocn-node-v2-secret key `application_plugins_json` holds nested or flat JSON for plugin props.
  env:
    OCN_PLUGINS: "edx-v1"
    OTC_ENDPOINT_URL: "https://obs.eu-de.otc.t-systems.com"
    OTC_DEFAULT_REGION: "eu-de"
    OTC_BUCKET_NAME: "ocn-node-plugins"
    OTC_ACCESS_KEY_ID:
      secretKeyRef:
        name: otc-obs-credentials
        key: access_key_id
    OTC_SECRET_ACCESS_KEY:
      secretKeyRef:
        name: otc-obs-credentials
        key: secret_access_key
    SPRING_APPLICATION_JSON:
      secretKeyRef:
        name: ocn-node-v2-secret
        key: application_plugins_json
        optional: true

  ingress:
    hosts:
      - host: banula-int.oli-system.com
    tls:
      - secretName: banula-int-tls
        hosts:
          - banula-int.oli-system.com
    features:
      router:
        routes:
          exposeCommon: false
          exposeAll: true
