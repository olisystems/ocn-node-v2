oli-app:
  replicaCount: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  restartPolicy: Always
  terminationGracePeriodSeconds: 45

  image:
    repository: "swr.eu-de.otc.t-systems.com/oli_banula/ocnnodev2"
    pullPolicy: IfNotPresent
    tag: ""

  imagePullSecrets:
    - name: default-secret

  service:
    type: ClusterIP
    port: 80
    containerPort: 8080
    name: ocn-node-v2-service

  # nginx ingress disabled — migrated to the Gateway below.
  ingress:
    enabled: false
  # Gateway API — OCN roaming hub. Full passthrough; every surface is
  # self-secured in-app (/ocpi OCPI-token, /admin API-key), so no JWT. Per-env
  # namespace + host in the overrides. DNS still points at nginx, so until
  # cutover reach it via --resolve to the Envoy EIP.
  gateway:
    enabled: true
    parentRef:
      name: banula-gateway
      sectionName: https
    router:
      prefix: "/ocn"
      stripPrefix: true
      routes:
        exposeAll: true
        exposeCommon: false
    rateLimiting:
      enabled: true
      rpm: 300

  env:
    # Ingress strips the "/ocn" router prefix, so the app serves at the root inside the pod.
    OCN_NODE_API: ""
    # Path segment every public route sits under. /health and the springdoc endpoints stay at root.
    OCN_NODE_API_PREFIX_PUBLIC: "/api/v2/public"
    OCN_NODE_ENABLE_SIGNING: "false"
    OCN_WEB_LOGGING_LEVEL: "TRACE"
    OCN_NODE_HAAS_ON: "true"
    OCN_NODE_STILL_ALIVE_RATE: "900000"
    OCN_NODE_HUB_CLIENT_INFO_SYNC_RATE: "3600000"
    OCN_FF_BANULA_VALIDATION: "true"

    # Comma-separated plugin ids to fetch from OBS before start (e.g. "edx_v1,other_v2").
    # Each id maps to object key <id>.jar. Override per env; empty = skip fetch.
    OCN_PLUGINS: ""

    # Optional plugin settings JSON (binds to Spring props, e.g. edx.*). Missing key is fine.
    SPRING_APPLICATION_JSON:
      secretKeyRef:
        name: ocn-node-v2-secret
        key: application_plugins_json
        optional: true

    ENVIRONMENT:
      configMapKeyRef:
        name: ocn-node-v2-config
        key: ENVIRONMENT
    SPRING_PROFILE:
      configMapKeyRef:
        name: ocn-node-v2-config
        key: SPRING_PROFILE
    OCN_NODE_URL:
      configMapKeyRef:
        name: ocn-node-v2-config
        key: OCN_NODE_URL
    OCN_REGISTRY_INDEXER_URL:
      configMapKeyRef:
        name: ocn-node-v2-config
        key: OCN_REGISTRY_INDEXER_URL
    OCN_NODE_PUBLIC_ADDRESS:
      configMapKeyRef:
        name: ocn-node-v2-config
        key: OCN_NODE_PUBLIC_ADDRESS
    OCN_NODE_DEV_MODE:
      configMapKeyRef:
        name: ocn-node-v2-config
        key: OCN_NODE_DEV_MODE
    OCN_NODE_HAAS_URL:
      configMapKeyRef:
        name: ocn-node-v2-config
        key: OCN_NODE_HAAS_URL
    OCN_NODE_LOG_CURL_COMMANDS:
      configMapKeyRef:
        name: ocn-node-v2-config
        key: OCN_NODE_LOG_CURL_COMMANDS
    OCN_NODE_LOG_FULL_HEADERS:
      configMapKeyRef:
        name: ocn-node-v2-config
        key: OCN_NODE_LOG_FULL_HEADERS
    JAVA_TOOL_OPTIONS:
      configMapKeyRef:
        name: ocn-node-v2-config
        key: JAVA_TOOL_OPTIONS
    OCN_NODE_ADMIN_KEY:
      secretKeyRef:
        name: ocn-node-v2-secret
        key: ocn_node_v2_admin_key
    OCN_REGISTRY_INDEXER_TOKEN:
      secretKeyRef:
        name: ocn-node-v2-secret
        key: node_indexer_token
    OCN_NODE_PRIVATE_KEY:
      secretKeyRef:
        name: ocn-node-v2-secret
        key: node_private_key
    OCN_NODE_POSTGRES_DATABASE:
      secretKeyRef:
        name: postgres-secret
        key: ocn_node_v2_postgres_database
    OCN_NODE_POSTGRES_USER:
      secretKeyRef:
        name: postgres-secret
        key: ocn_node_v2_postgres_user
    OCN_NODE_POSTGRES_PASSWORD:
      secretKeyRef:
        name: postgres-secret
        key: ocn_node_v2_postgres_password

  resources:
    requests:
      memory: 768Mi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 2000m

  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 90
    periodSeconds: 10
    failureThreshold: 5
    timeoutSeconds: 5

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 60
    periodSeconds: 5
    failureThreshold: 10
    timeoutSeconds: 5

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 90

  podDisruptionBudget:
    enabled: true
    minAvailable: 1
