oli-app:
  fullnameOverride: "ocn-node-v2-dev"
  persistence:
    - name: ocn-node-v2-dev-plugins
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      mountPath: /app/plugins
  image:
    tag: "develop-0f0965e"
  ingress:
    hosts:
      - host: banula-dev.oli-system.com
    tls:
      - secretName: banula-dev-tls
        hosts:
          - banula-dev.oli-system.com
    features:
      router:
        routes:
          exposeCommon: false
          exposeAll: true
