oli-app:
  fullnameOverride: "ocn-node-v2-prod"

  image:
    tag: "v1.4.5-rc"

  env:
    OCN_NODE_PUBLIC_ADDRESS: "0x4e6577b848FDFAe73EFc3adAd41964fC31CD34e7"

  gateway:
    parentRef:
      namespace: banula-prod
    hosts:
      - banula.oli-system.com

  resources:
    requests:
      cpu: 200m
    limits:
      cpu: 1000m

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
